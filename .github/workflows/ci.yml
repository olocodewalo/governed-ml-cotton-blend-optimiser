name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install
        run: python -m pip install -r requirements-lock.txt

      - name: Generate synthetic data
        run: python -m data.generate

      - name: Train candidate model
        run: python -m models.train

      - name: Golden set + policy thresholds
        run: python -m eval.run_golden

      - name: Regression gate vs eval/baseline.json
        run: python -m eval.regression_suite

      - name: Tests
        run: python -m pytest -q

      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-metrics
          path: |
            eval/latest_metrics.json
            artifacts/model_registry.json
            docs/shap_summary.png
          if-no-files-found: ignore
